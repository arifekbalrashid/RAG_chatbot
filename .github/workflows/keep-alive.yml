name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -fsS "${{ secrets.RENDER_URL }}" -o /dev/null -w "HTTP Status: %{http_code}\n" || echo "Ping failed with exit code $?"
